[project]
name = "negative-lab"
version = "0.1.0"
description = "负片去色罩与反相软件（密度域 + 每通道幂指数混合模型）"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.2",
    "Pillow>=10.2",
]

[project.optional-dependencies]
# GUI 与 RAW 解码依赖推迟到 Phase 2 再安装（规格 §13.2：不安装不必要的大型依赖）。
gui = ["PySide6>=6.6"]
raw = ["rawpy>=0.19"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# 上面这行差点被我改成 "-ra -X faulthandler"：那是**错的**，`-X` 是 python
# 解释器参数、pytest 不认，改完 `python -m pytest` 直接 "unrecognized arguments: -X"，
# 而且 CI 照抄 —— 等于把测试命令本身弄炸（2026-09-09 就是这么翻车的，已回退）。
# 背景：全量跑**偶发在 fixture setup 阶段硬崩**（三次全量崩过一次，退出码 1，
# 日志里只有半截栈、认不出是哪个测试）。要查这种崩溃，在命令行现拼：
#   python -X faulthandler -m pytest -v          # -v 才打得出测试名
#   python -m pytest -p faulthandler --faulthandler-timeout=120
# 这是"让故障可诊断"的正确姿势，不是把 flaky 藏进配置里。

# ---- 静态门禁（2026-09-08 审查：此前无任何 ruff 配置，425 项存量无人守）----
# 策略：day-1 必须是绿的，否则 CI 会被直接关掉。因此先只锁「会真炸」的类别：
#   E9 语法错误 / F6x 无效比较 / F7 结构错误 / F82 未定义名 / F811 重定义
# 已知的存量噪声（F401 未用导入 69、F841 未用变量 9）先 ignore，清完一类
# 就从这里删一项 —— 收紧方向单一，不会再次失守。
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", ".venv", "outputs"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = []
