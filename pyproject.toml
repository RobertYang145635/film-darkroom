[project]
name = "negative-lab"
version = "0.1.0"
description = "负片去色罩与反相软件（密度域 + 每通道幂指数混合模型）"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.2",
    "Pillow>=10.2",
]

[project.optional-dependencies]
# GUI 与 RAW 解码依赖推迟到 Phase 2 再安装（规格 §13.2：不安装不必要的大型依赖）。
gui = ["PySide6>=6.6"]
raw = ["rawpy>=0.19"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# -X faulthandler：本仓库全量跑**偶发在 fixture setup 阶段硬崩**（2026-09-09 三次
# 全量里崩过一次，退出码 1，日志里只有 C 栈、没有 Python 栈，无法定位）。
# 崩溃时 faulthandler 会把 Python 层的现场打出来，下一次复发才查得动。
# 这是让故障可诊断，不是把 flaky 藏起来：真复发必须按现场修。
addopts = "-ra -X faulthandler"

# ---- 静态门禁（2026-09-08 审查：此前无任何 ruff 配置，425 项存量无人守）----
# 策略：day-1 必须是绿的，否则 CI 会被直接关掉。因此先只锁「会真炸」的类别：
#   E9 语法错误 / F6x 无效比较 / F7 结构错误 / F82 未定义名 / F811 重定义
# 已知的存量噪声（F401 未用导入 69、F841 未用变量 9）先 ignore，清完一类
# 就从这里删一项 —— 收紧方向单一，不会再次失守。
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", ".venv", "outputs"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = []
